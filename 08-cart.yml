- name: configure cart server
  hosts: cart
  become: yes
  tasks:
    - name: install nodejs
      package:
        name: nodejs
        state: present

    - name: add project system cart
      user:
        name: project
        system: yes
        home: /app
        shell: /sbin/nologin
        comment: project system usr

    - name: remove app directory
      file:
        path: /app
        state: absent

    - name: delete cart.zip in /tmp
      file:
        path: /tmp/cart.zip
        state: absent

    - name: create app directory
      file:
        path: /app
        state: directory

    - name: download cart zip file
      get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
        dest: /tmp/cart.zip

    - name: unzip cart file
      unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: yes # the zip file is on the remote target host (cart). ansible server is local here.

    - name: Install npm dependencies
      community.general.npm:
        path: /app
        #state: present # defaults to present

    - name: copy cart.service
      template:
        src: cart.service.j2
        dest: /etc/systemd/system/cart.service

    - name: Enable and start service with daemon reload
      ansible.builtin.systemd_service:
        name: cart
        state: started
        enabled: yes
        daemon_reload: yes
