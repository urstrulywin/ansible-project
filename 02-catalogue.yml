- name: configure catalogue server
  hosts: catalogue
  become: yes
  tasks:
    - name: install nodejs
      package:
        name: nodejs
        state: present

    - name: add project system user
      user:
        name: project
        system: yes
        home: /app
        shell: /sbin/nologin
        comment: project system usr

    - name: remove app directory
      file:
        path: /app
        state: absent

    - name: delete catalogue.zip in /tmp
      file:
        path: /tmp/catalogue.zip
        state: absent

    - name: create app directory
      file:
        path: /app
        state: directory

    - name: download catalogue zip file
      get_url:
        url: https://roboshop-artifacts.s3.amazonaws.com/catalogue-v3.zip
        dest: /tmp/catalogue.zip

    - name: unzip catalogue file
      unarchive:
        src: /tmp/catalogue.zip
        dest: /app
        remote_src: yes # the zip file is on the remote target host (catalogue). ansible server is local here.

    - name: Install npm dependencies
      community.general.npm:
        path: /app
        #state: present # defaults to present

    - name: copy catalogue.service
      template:
        src: catalogue.service.j2
        dest: /etc/systemd/system/catalogue.service

    - name: copy mongo repo
      copy:
        src: mongo.repo
        dest: /etc/yum.repos.d/mongo.repo

    - name: install mongodb client - mongodb-mongosh
      package:
        name: mongodb-mongosh
        state: present

    - name: check catalogue database exists or not
      ansible.builtin.shell: >
        mongosh --host "{{ MONGODB_HOST }}" --quiet
        --eval 'db.getMongo().getDBNames().includes("catalogue")'
      register: catalogue_output
      changed_when: false
      tags:
        - mongodb

    - name: print catalogue_output
      ansible.builtin.debug:
        msg: "{{ catalogue_output.stdout }}"
      tags:
        - mongodb

    - name: load products
      ansible.builtin.shell: mongosh --host "{{ MONGODB_HOST }}" < /app/db/master-data.js
      when: catalogue_output.stdout | trim != "true"
      tags:
        - mongodb

    - name: Enable and start service with daemon reload
      ansible.builtin.systemd_service:
        name: catalogue
        state: started
        enabled: yes
        daemon_reload: yes
